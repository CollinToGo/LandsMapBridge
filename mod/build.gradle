plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'landsmapbridge-fabric'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
		content {
			includeGroup 'mezz.jei'
			includeGroup 'net.mezzdev.config'
		}
	}
}

// The wire protocol is shared with the Paper plugin.
sourceSets.main.java.srcDir '../common/src/main/java'

// XaeroLib is only shipped inside the map jars, so take it from there for compiling.
def extractXaeroLib = tasks.register('extractXaeroLib', Copy) {
	def worldMap = configurations.detachedConfiguration(dependencies.create("maven.modrinth:xaeros-world-map:${xaero_worldmap_version}"))
	worldMap.transitive = false
	from({ zipTree(worldMap.singleFile) }) {
		include 'META-INF/jars/xaerolib-*.jar'
		eachFile { path = name }
	}
	includeEmptyDirs = false
	into layout.buildDirectory.dir('xaerolib')
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	implementation "maven.modrinth:xaeros-minimap:${xaero_minimap_version}"
	implementation "maven.modrinth:xaeros-world-map:${xaero_worldmap_version}"
	compileOnly files(layout.buildDirectory.dir('xaerolib').map { it.asFileTree.files }).builtBy(extractXaeroLib)

	localRuntime "maven.modrinth:mac-input-fixes-neoforged:${mac_input_fixes_version}"
	localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
